<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>GreatNN black cat</title>
  <style>
    .tail { transform-origin: 94px 92px; animation: tail 3.4s ease-in-out infinite; }
    .eyes { transform-origin: 60px 66px; animation: blink 4.6s ease-in-out infinite; }
    @keyframes tail { 0%,100% {transform:rotate(-6deg)} 50% {transform:rotate(8deg)} }
    @keyframes blink { 0%,43%,49%,100% {transform:scaleY(1)} 46% {transform:scaleY(.09)} }
    @media (prefers-reduced-motion:reduce) { .tail,.eyes {animation:none} }
  </style>
  <rect x="2" y="2" width="124" height="124" rx="30" fill="#d9f4e9"/>
  <circle cx="102" cy="28" r="8" fill="#b2e6d1"/>
